[package]
name = "cheapster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
